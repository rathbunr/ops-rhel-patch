---
# roles/rhel_patching/defaults/main.yml
# All defaults for the rhel_patching role.
# Override via group_vars, host_vars, or AAP survey.

# Patching behavior
patch_security_only: false
patch_update_only: true
enable_autoremove: false
exclude_packages: []

# Long-running dnf transaction handling.
# async keeps the transaction alive if the SSH session drops mid-update.
patch_async_timeout: 3600
patch_async_poll: 30

# Disk space thresholds
min_boot_free_mb: 300
min_root_free_gb: 5
min_var_free_gb: 3

# Kernel retention
installonly_limit: 2

# Reboot
# needed: reboot only when packages changed and `dnf needs-restarting -r`
#   asks for it (fleet default).
# always: reboot every run, also when nothing changed (build workflow: the
#   remediation run before it needs a reboot too).
patch_reboot: needed
patch_reboot_timeout: 1800
patch_reboot_delay: 30

# Firmware updates (fwupd), off by default.
# patch_firmware_platform names the platform the operator says the hosts are;
# the run checks it against `systemd-detect-virt` before any change and fails
# the host on a mismatch. Each platform lists the detect-virt values it
# accepts; add another hypervisor (e.g. kvm) or a physical platform
# (`none`, detect-virt's answer on bare metal) here, not in the tasks.
patch_firmware_platform: none
patch_firmware_platforms:
  vm:
    - microsoft

# Post-reboot service validation
critical_services:
  - sshd
  - chronyd

# Audit logging
patch_log_dir: /var/log/patching
patch_log_retention_days: 90
